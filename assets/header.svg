<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <style>
    .tw1 { animation: tw 2.4s ease-in-out infinite; }
    .tw2 { animation: tw 3.1s ease-in-out infinite .8s; }
    .tw3 { animation: tw 1.9s ease-in-out infinite 1.4s; }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }

    .orbit { transform-box: view-box; transform-origin: 1010px 150px; animation: spin 9s linear infinite; }
    .orbit2 { transform-box: view-box; transform-origin: 1010px 150px; animation: spin 15s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .cat { animation: bob 2.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translate(0,0); } 50% { transform: translate(0,-6px); } }

    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

    .tail { transform-box: fill-box; transform-origin: 0% 100%; animation: wag 1.6s ease-in-out infinite; }
    @keyframes wag { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-5deg); } }

    .cursor { animation: cur 1s steps(1) infinite; }
    @keyframes cur { 50% { opacity: 0; } }

    .shoot { animation: shoot 6s linear infinite 1s; opacity: 0; }
    @keyframes shoot {
      0% { transform: translate(0,0); opacity: 0; }
      3% { opacity: 1; }
      14% { transform: translate(-260px,130px); opacity: 0; }
      100% { transform: translate(-260px,130px); opacity: 0; }
    }

    .shoot2 { animation: shoot2 9s linear infinite 4.5s; opacity: 0; }
    @keyframes shoot2 {
      0% { transform: translate(0,0); opacity: 0; }
      3% { opacity: .9; }
      13% { transform: translate(210px,105px); opacity: 0; }
      100% { transform: translate(210px,105px); opacity: 0; }
    }

    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .75; } }

    .cloud { animation: drift 7s ease-in-out infinite; }
    @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(14px,-5px); } }
  </style>

  <defs>
    <radialGradient id="planet" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#0D1117"/>
  <rect x="16" y="16" width="1168" height="288" rx="12" fill="none" stroke="#0369A1" stroke-width="3"/>

  <!-- window controls -->
  <g shape-rendering="crispEdges">
    <rect x="38" y="38" width="12" height="12" fill="#0369A1"/>
    <rect x="58" y="38" width="12" height="12" fill="#0284C7"/>
    <rect x="78" y="38" width="12" height="12" fill="#38BDF8"/>
  </g>
  <text x="600" y="49" text-anchor="middle" fill="#6E7681" font-size="13">jose@cloud: ~</text>

  <!-- twinkling pixel stars -->
  <g shape-rendering="crispEdges">
    <rect class="tw1" x="520" y="70" width="4" height="4" fill="#BAE6FD"/>
    <rect class="tw2" x="610" y="250" width="3" height="3" fill="#38BDF8"/>
    <rect class="tw3" x="700" y="90" width="5" height="5" fill="#0284C7"/>
    <rect class="tw1" x="760" y="200" width="4" height="4" fill="#BAE6FD"/>
    <rect class="tw2" x="820" y="60" width="4" height="4" fill="#38BDF8"/>
    <rect class="tw3" x="860" y="270" width="3" height="3" fill="#BAE6FD"/>
    <rect class="tw1" x="1140" y="70" width="4" height="4" fill="#0284C7"/>
    <rect class="tw2" x="1150" y="250" width="5" height="5" fill="#BAE6FD"/>
    <rect class="tw3" x="1100" y="40" width="3" height="3" fill="#38BDF8"/>
    <rect class="tw1" x="660" y="160" width="3" height="3" fill="#38BDF8"/>
    <rect class="tw2" x="560" y="200" width="4" height="4" fill="#0284C7"/>
    <rect class="tw3" x="440" y="270" width="4" height="4" fill="#BAE6FD"/>
  </g>

  <!-- shooting stars -->
  <g class="shoot">
    <line x1="1120" y1="40" x2="1160" y2="20" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round"/>
    <circle cx="1120" cy="40" r="2.5" fill="#F0F9FF"/>
  </g>
  <g class="shoot2">
    <line x1="330" y1="60" x2="360" y2="45" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="330" cy="60" r="2.5" fill="#BAE6FD"/>
  </g>

  <!-- pixel cloud (AWS nod) -->
  <g class="cloud" shape-rendering="crispEdges" opacity=".9">
    <rect x="640" y="104" width="48" height="10" fill="#BAE6FD"/>
    <rect x="648" y="94" width="20" height="10" fill="#BAE6FD"/>
    <rect x="668" y="98" width="14" height="6" fill="#7DD3FC"/>
  </g>

  <!-- identity -->
  <text x="58" y="104" fill="#38BDF8" font-size="20" font-weight="700">$ whoami</text>
  <text x="58" y="160" fill="url(#name)" font-size="40" font-weight="800" letter-spacing="1.5">JOSÉ MANUEL SÁNCHEZ</text>
  <text x="60" y="200" fill="#BAE6FD" font-size="20">backend · cloud · data engineering</text>
  <rect x="60" y="222" width="11" height="11" fill="#FF9900"/>
  <text x="82" y="233" fill="#8B949E" font-size="15">co-founder @ Kyloo · software engineering @ UTEZ</text>
  <text x="60" y="270" fill="#38BDF8" font-size="16">&gt; deploying something new<tspan class="cursor" fill="#BAE6FD">█</tspan></text>

  <!-- planet + orbits -->
  <circle class="glow" cx="1010" cy="150" r="95" fill="url(#halo)"/>
  <ellipse cx="1010" cy="150" rx="118" ry="118" fill="none" stroke="#0369A1" stroke-width="1.5" stroke-dasharray="4 8"/>
  <ellipse cx="1010" cy="150" rx="80" ry="80" fill="none" stroke="#0284C7" stroke-width="1" stroke-dasharray="2 6" opacity=".7"/>
  <circle cx="1010" cy="150" r="46" fill="url(#planet)"/>
  <path d="M966 140 Q1010 128 1054 140" fill="none" stroke="#0C4A6E" stroke-width="5" opacity=".45"/>
  <path d="M970 164 Q1010 176 1050 164" fill="none" stroke="#F0F9FF" stroke-width="3" opacity=".35"/>
  <path d="M978 178 Q1010 188 1042 178" fill="none" stroke="#FF9900" stroke-width="2" opacity=".75"/>

  <g class="orbit">
    <rect x="1124" y="146" width="10" height="10" fill="#FF9900" shape-rendering="crispEdges"/>
  </g>
  <g class="orbit2">
    <rect x="926" y="146" width="8" height="8" fill="#38BDF8" shape-rendering="crispEdges"/>
  </g>

  <!-- pixel cat sitting on the bottom -->
  <g transform="translate(700 150)">
    <g class="cat" shape-rendering="crispEdges">
      <g class="tail">
        <rect x="118" y="62" width="16" height="16" fill="#38BDF8"/>
        <rect x="134" y="46" width="16" height="16" fill="#38BDF8"/>
        <rect x="134" y="30" width="16" height="16" fill="#38BDF8"/>
        <rect x="118" y="24" width="16" height="16" fill="#38BDF8"/>
      </g>
      <rect x="44" y="54" width="74" height="64" fill="#38BDF8"/>
      <rect x="30" y="72" width="18" height="46" fill="#38BDF8"/>
      <rect x="44" y="10" width="72" height="62" fill="#38BDF8"/>
      <rect x="44" y="-8" width="20" height="24" fill="#38BDF8"/>
      <rect x="96" y="-8" width="20" height="24" fill="#38BDF8"/>
      <rect x="50" y="-2" width="8" height="10" fill="#0369A1"/>
      <rect x="102" y="-2" width="8" height="10" fill="#0369A1"/>
      <g class="eyes">
        <rect x="62" y="30" width="8" height="8" fill="#0D1117"/>
        <rect x="92" y="30" width="8" height="8" fill="#0D1117"/>
      </g>
      <rect x="78" y="45" width="8" height="7" fill="#FF9900"/>
      <rect x="54" y="44" width="8" height="4" fill="#F9A8D4" opacity=".6"/>
      <rect x="100" y="44" width="8" height="4" fill="#F9A8D4" opacity=".6"/>
      <rect x="50" y="112" width="22" height="12" fill="#E0F2FE"/>
      <rect x="92" y="112" width="22" height="12" fill="#E0F2FE"/>
    </g>
  </g>
</svg>
